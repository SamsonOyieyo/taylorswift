name: Build and Release Flutter App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ------------------------------------
  # JOB 1: Build Android APKs (Split by ABI)
  # ------------------------------------
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
          body: |
            ## 📱 Android Installation
            - **arm64-v8a**: Most modern Android phones (Use this if unsure).
            - **armeabi-v7a**: Older 32-bit Android phones.
            - **x86_64**: Tablets or Emulators.
            
            ## 💻 Windows Installation
            - Download the `*-installer.exe` file.
            - Double-click to run the setup wizard.
            - The app will be installed to your PC with a desktop shortcut!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------
  # JOB 2: Build Windows Installer (setup.exe)
  # ------------------------------------
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      # NEW: This command takes your build and wraps it into a professional installer
     # Change this step
      - name: Build Windows Installer
        run: dart run inno_bundle
      # NEW: Uploads the generated setup.exe file
      - name: Upload Windows Installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/innobundle/*-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
